name: Build DiPlay TV launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tvlauncher/**'
      - '.github/workflows/build-tv-launcher.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android 4.4-compatible TV launcher
        working-directory: tvlauncher
        run: ../gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-TV-launcher-debug
          path: tvlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
